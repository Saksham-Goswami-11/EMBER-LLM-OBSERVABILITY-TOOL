# Ember — one service, one volume, no external dependencies.
#
#   cp .env.example .env     # set your own EMBER_API_KEY
#   docker compose up -d --build
#   open http://localhost:8080
#
# To run the published image instead of building from source, comment out
# `build:` and uncomment the `image:` line below.

services:
  ember:
    build:
      context: .
      dockerfile: Dockerfile
    # image: ghcr.io/sakshamgoswami/ember:latest
    image: ember:local
    container_name: ember
    restart: unless-stopped
    ports:
      # Host port is configurable; the container always listens on 8080.
      - "${EMBER_PORT:-8080}:8080"
    environment:
      # Pin the ingest key up front so you never have to scrape it from the
      # logs. Leave it unset and Ember generates one, printed once at startup.
      EMBER_API_KEY: "${EMBER_API_KEY:-}"
      EMBER_DB_PATH: /data/ember.db
      EMBER_ADDR: ":8080"
      # Optional: mount a JSON file and point this at it to override model
      # pricing (see examples/demo-agent/pricing.example.json).
      EMBER_PRICING_PATH: "${EMBER_PRICING_PATH:-}"
    volumes:
      # Named volume keeps traces across `docker compose down` (but not
      # `down -v`). Swap for a bind mount like ./data:/data to see the file.
      - ember-data:/data
    healthcheck:
      # The runtime image is distroless — no shell, no curl — so the binary
      # probes itself.
      test: ["CMD", "/ember", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  ember-data:
